name: Windows C++ build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake for x64
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel 4
